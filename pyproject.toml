[build-system]
requires = ["setuptools>=78,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ace"
version = "0.1.0"
description = "Reproducible training and offline inference for Trace the Ace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.2.6",
  "pandas==3.0.3",
  "pyarrow==24.0.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
